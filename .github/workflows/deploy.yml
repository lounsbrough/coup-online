name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  deploy-server-vercel:
    needs: verify
    runs-on: ubuntu-latest
    concurrency: deploy-server-${{ inputs.environment }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Build and deploy server to Vercel
        id: deploy
        run: |
          cd server
          vercel link --yes --project coup-server --token=${{ secrets.VERCEL_TOKEN }}
          vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
          pnpm build
          original_node_engine="$(node -p 'require("./package.json").engines.node')"
          restore_node_engine() {
            node -e '
              const fs = require("node:fs")
              const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"))
              packageJson.engines.node = process.argv[1]
              fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`)
            ' "$original_node_engine"
          }
          trap restore_node_engine EXIT
          node -e '
            const fs = require("node:fs")
            const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"))
            packageJson.engines.node = "24.x"
            fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`)
          '
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
          restore_node_engine
          trap - EXIT
          deployment_url="$(vercel deploy --prebuilt --target=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

  deploy-server-raspberry-pi:
    needs: verify
    runs-on: ubuntu-latest
    concurrency: deploy-socket-server-${{ inputs.environment }}
    if: ${{ inputs.environment == 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SOCKET_SERVER_SSH_KEY }}

      - name: Deploy server to Raspberry Pi
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: lounsbrough.com
          username: pi
          key: ${{ secrets.SOCKET_SERVER_SSH_KEY }}
          port: 8222
          script: |
            set -e
            export CI=true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /var/www/html/coup-online/server
            git fetch origin
            git checkout ${{ github.sha }}
            corepack enable pnpm
            corepack prepare pnpm@latest --activate
            pnpm i
            pnpm build
            /home/pi/.local/share/pnpm/pm2 restart coup-online

  deploy-client-vercel:
    needs: [verify, deploy-server-vercel]
    runs-on: ubuntu-latest
    concurrency: deploy-client-${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node

      - name: Build and deploy client to Vercel
        run: |
          # Run from repo root so Vercel applies the project's Root Directory (client) exactly once.
          export VITE_APP_VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          vercel link --yes --project coup-client --token=${{ secrets.VERCEL_TOKEN }}
          vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            server_url="${{ needs.deploy-server-vercel.outputs.deployment-url }}"
            if [ -z "$server_url" ]; then
              echo "Preview server deployment did not return a URL" >&2
              exit 1
            fi
            export VITE_PRIMARY_API_URL="$server_url"
            export VITE_SECONDARY_API_URL="$server_url"
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
          vercel deploy --prebuilt --target=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
