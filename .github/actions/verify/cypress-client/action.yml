name: Run Cypress Client Tests

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/setup-node
    - uses: ./.github/actions/setup-valkey
    - run: |
        cd client
        pnpm add -g concurrently wait-on
        pnpm cypress install
        pnpm concurrently --kill-others --success first "pnpm --prefix ../server dev" "pnpm start:cypress" "pnpm wait-on tcp:8008 && pnpm wait-on http://localhost:3000 && pnpm cypress run"
      shell: bash
    - name: Save Cypress Output
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cypress-output
        path: |
          **/cypress/screenshots/
          **/cypress/videos/
        retention-days: 7
